[package]
name = "ecdh-chat"
version = "3.1.1"
description = "Peer-to-peer end-to-end encrypted chat"
license = "GPL-3.0-only"
publish = false
edition = "2024"
rust-version = "1.90"

[lib]
name = "ecdh_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-window-state = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
