[package]
name = "ecdh-chat"
version = "4.1.0"
description = "Peer-to-peer end-to-end encrypted chat"
license = "GPL-3.0-only"
publish = false
edition = "2024"
rust-version = "1.90"

[lib]
name = "ecdh_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
# Updates are the signed installer or AppImage itself, never an archive, so the archive support
# (zip and tar, and their extraction advisories) isn't built in.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2.5.0"

# WebRTC for the Linux app, whose webview (WebKitGTK) has none. See src/rtc.rs. Windows' WebView2
# has its own, so none of this is built into the Windows app.
[target.'cfg(target_os = "linux")'.dependencies]
webrtc = "=0.17.2"
bytes = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
